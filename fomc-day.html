<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1600">
  <title>FOMC Day — Topstep</title>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Paralucent';
      src: local('Paralucent Medium'), local('Paralucent-Medium'), local('Paralucent');
      font-weight: 500;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #080D14;
    }

    .graphic {
      position: relative;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      background: #080D14;
      font-family: 'Work Sans', sans-serif;
    }

    /* ── BACKGROUND ─────────────────────────────────────── */

    .bg-base {
      position: absolute;
      inset: 0;
      /* Strong warm amber glow positioned right-center, plus subtle blue tones */
      background:
        radial-gradient(ellipse 1100px 750px at 70% 88%,
          rgba(180,100,28,0.70) 0%,
          rgba(140,75,18,0.40) 30%,
          rgba(27,41,69,0.20) 60%,
          transparent 80%
        ),
        radial-gradient(ellipse 700px 400px at 70% 100%,
          rgba(220,140,50,0.55) 0%,
          transparent 55%
        ),
        linear-gradient(175deg, #0A0F18 0%, #0D1522 55%, #080D14 100%);
    }

    /* Fine grid — very subtle */
    .bg-lines {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(90deg,
          transparent 0px, transparent 49px,
          rgba(105,182,210,0.018) 49px, rgba(105,182,210,0.018) 50px
        ),
        repeating-linear-gradient(0deg,
          transparent 0px, transparent 49px,
          rgba(105,182,210,0.012) 49px, rgba(105,182,210,0.012) 50px
        );
    }

    /* ── BUILDING ─────────────────────────────────────── */
    .building-wrap {
      position: absolute;
      right: -80px;
      bottom: 0;
      width: 1160px;
      height: 860px;
      pointer-events: none;
    }

    /* ── OVERLAYS ────────────────────────────────────── */

    /* Left content shield — lets glow bleed through on right */
    .fade-left {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(8,13,20,0.92) 0%,
        rgba(8,13,20,0.80) 35%,
        rgba(8,13,20,0.35) 58%,
        transparent 72%
      );
    }

    .fade-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 200px;
      background: linear-gradient(180deg, rgba(8,13,20,0.80) 0%, transparent 100%);
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 110% 110% at 50% 50%,
        transparent 48%, rgba(5,8,13,0.75) 100%);
    }

    .fade-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(0deg, rgba(5,8,12,0.95) 0%, transparent 100%);
    }

    /* ── LOGO ─────────────────────────────────────────── */
    .logo-wrap {
      position: absolute;
      top: 46px;
      left: 72px;
      z-index: 20;
    }

    /* ── CONTENT ──────────────────────────────────────── */
    .content {
      position: absolute;
      left: 72px;
      top: 0; bottom: 0;
      width: 830px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-bottom: 20px;
      z-index: 10;
    }

    .eyebrow {
      font-weight: 300;
      font-size: 14px;
      letter-spacing: 0.42em;
      color: #69B6D2;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .headline {
      font-family: 'Paralucent', 'Futura', 'Century Gothic', 'Work Sans', sans-serif;
      font-weight: 500;
      font-size: 168px;
      line-height: 0.86;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      background: linear-gradient(180deg,
        #AA723A 0%,
        #D29C5C 32%,
        #F2CE95 62%,
        #C48743 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 30px;
    }

    .divider {
      width: 56px;
      height: 2px;
      background: linear-gradient(90deg, #E2A355, #F6DCA8 55%, transparent);
      margin-bottom: 28px;
    }

    .subheadline {
      font-weight: 800;
      font-size: 52px;
      letter-spacing: 0.07em;
      color: #FFFFFF;
      text-transform: uppercase;
      margin-bottom: 38px;
      line-height: 1;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 38px;
    }

    .speaker-line {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .pip {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #E2A355;
      flex-shrink: 0;
    }

    .speaker {
      font-weight: 300;
      font-size: 18px;
      letter-spacing: 0.24em;
      color: #B9D4D4;
      text-transform: uppercase;
    }

    .datetime {
      font-weight: 500;
      font-size: 18px;
      letter-spacing: 0.20em;
      color: #EFEDE9;
      text-transform: uppercase;
      padding-left: 15px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 1px solid rgba(226,163,85,0.50);
      border-radius: 3px;
      padding: 8px 20px 8px 15px;
      width: fit-content;
      background: rgba(226,163,85,0.10);
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #E2A355;
      box-shadow: 0 0 7px 2px rgba(226,163,85,0.65);
    }

    .badge-text {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.30em;
      color: #E2A355;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
<div class="graphic">

  <!-- BACKGROUND -->
  <div class="bg-base"></div>
  <div class="bg-lines"></div>

  <!-- FEDERAL RESERVE ECCLES BUILDING -->
  <div class="building-wrap">
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 1160 860"
         width="1160" height="860"
         aria-hidden="true">
      <defs>

        <!-- PRIMARY SKY — bright warm amber at colonnade level, dark everywhere else -->
        <!-- colonnade sits at y≈390–540 in this 860-height SVG (≈45–63%) -->
        <radialGradient id="skyGlow" cx="50%" cy="58%" r="60%">
          <stop offset="0%"   stop-color="#D08830" stop-opacity="0.95"/>
          <stop offset="18%"  stop-color="#B8702A" stop-opacity="0.75"/>
          <stop offset="42%"  stop-color="#7A4A1A" stop-opacity="0.45"/>
          <stop offset="72%"  stop-color="#1B2945" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#080D14" stop-opacity="0"/>
        </radialGradient>

        <!-- HORIZON BURST — intense low glow at building base -->
        <radialGradient id="horizonBurst" cx="50%" cy="92%" r="50%">
          <stop offset="0%"   stop-color="#E09840" stop-opacity="0.88"/>
          <stop offset="30%"  stop-color="#B87830" stop-opacity="0.55"/>
          <stop offset="70%"  stop-color="#7A4A1A" stop-opacity="0.20"/>
          <stop offset="100%" stop-color="#080D14" stop-opacity="0"/>
        </radialGradient>

        <!-- Building bodies — near-black silhouette -->
        <linearGradient id="buildBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#0A0F1A"/>
          <stop offset="100%" stop-color="#060910"/>
        </linearGradient>

        <!-- Steps -->
        <linearGradient id="stepsGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#10182A"/>
          <stop offset="100%" stop-color="#07090F"/>
        </linearGradient>

        <!-- Gold cornice line -->
        <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="#AA723A" stop-opacity="0"/>
          <stop offset="15%"  stop-color="#D29C5C" stop-opacity="0.70"/>
          <stop offset="50%"  stop-color="#F2CE95" stop-opacity="0.85"/>
          <stop offset="85%"  stop-color="#D29C5C" stop-opacity="0.70"/>
          <stop offset="100%" stop-color="#AA723A" stop-opacity="0"/>
        </linearGradient>

        <!-- Window fill — faint slate glow -->
        <linearGradient id="winFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#263548"/>
          <stop offset="100%" stop-color="#192333"/>
        </linearGradient>

        <!-- Fade mask — building fades into darkness at very top -->
        <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="black" stop-opacity="0"/>
          <stop offset="12%"  stop-color="black" stop-opacity="1"/>
          <stop offset="100%" stop-color="black" stop-opacity="1"/>
        </linearGradient>
        <mask id="topMask">
          <rect width="1160" height="860" fill="url(#topFade)"/>
        </mask>

        <!-- Ray mask — rays fade to transparent at top -->
        <linearGradient id="rayFade" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%"   stop-color="white" stop-opacity="0"/>
          <stop offset="20%"  stop-color="white" stop-opacity="1"/>
          <stop offset="100%" stop-color="white" stop-opacity="0.4"/>
        </linearGradient>
        <mask id="rayMask">
          <rect width="1160" height="860" fill="url(#rayFade)"/>
        </mask>

      </defs>

      <!-- ░░ SKY ATMOSPHERE ░░ -->
      <rect x="0" y="0" width="1160" height="860" fill="url(#skyGlow)"/>
      <rect x="0" y="0" width="1160" height="860" fill="url(#horizonBurst)"/>

      <!-- ░░ CREPUSCULAR RAYS — fan from building horizon ░░ -->
      <g mask="url(#rayMask)" opacity="0.18">
        <line x1="580" y1="740" x2="40"  y2="0"   stroke="#E09840" stroke-width="100"/>
        <line x1="580" y1="740" x2="160" y2="0"   stroke="#D08830" stroke-width="70"/>
        <line x1="580" y1="740" x2="300" y2="0"   stroke="#C07820" stroke-width="50"/>
        <line x1="580" y1="740" x2="430" y2="0"   stroke="#E09840" stroke-width="80"/>
        <line x1="580" y1="740" x2="510" y2="0"   stroke="#F0A848" stroke-width="55"/>
        <line x1="580" y1="740" x2="580" y2="0"   stroke="#F2CE95" stroke-width="110"/>
        <line x1="580" y1="740" x2="650" y2="0"   stroke="#F0A848" stroke-width="55"/>
        <line x1="580" y1="740" x2="730" y2="0"   stroke="#E09840" stroke-width="80"/>
        <line x1="580" y1="740" x2="860" y2="0"   stroke="#C07820" stroke-width="50"/>
        <line x1="580" y1="740" x2="1000" y2="0"  stroke="#D08830" stroke-width="70"/>
        <line x1="580" y1="740" x2="1120" y2="0"  stroke="#E09840" stroke-width="100"/>
      </g>

      <!-- ════════════════════════════════════════════════
           ECCLES BUILDING SILHOUETTE
           Viewport: 1160 × 860

           Facade spans x: 40 → 1120  (1080px wide)
           Ground:  y = 760
           Roof:    y = 130

           Elements top → bottom:
             Parapet cap       y 118–132
             Parapet           y 132–158
             Attic story       y 158–300
             Entablature       y 300–380
             Colonnade cols    y 380–538
             Stylobate         y 538–562
             High podium       y 562–680
             Steps × 3        y 680–760
           ════════════════════════════════════════════ -->

      <!-- PODIUM (bottom solid mass) -->
      <rect x="40"  y="562" width="1080" height="118" fill="url(#buildBody)" mask="url(#topMask)"/>

      <!-- STYLOBATE — raised platform under columns -->
      <rect x="40"  y="538" width="1080" height="26"  fill="#0C1320"/>

      <!-- COLONNADE — 20 columns, 32px wide, 54px pitch → 20×54 = 1080 spans x40→1120
           col left edges: 40, 94, 148, 202 … step 54 -->
      <g fill="#060910">
        <rect x="40"  y="380" width="32" height="160"/>
        <rect x="94"  y="380" width="32" height="160"/>
        <rect x="148" y="380" width="32" height="160"/>
        <rect x="202" y="380" width="32" height="160"/>
        <rect x="256" y="380" width="32" height="160"/>
        <rect x="310" y="380" width="32" height="160"/>
        <rect x="364" y="380" width="32" height="160"/>
        <rect x="418" y="380" width="32" height="160"/>
        <rect x="472" y="380" width="32" height="160"/>
        <rect x="526" y="380" width="32" height="160"/>
        <rect x="580" y="380" width="32" height="160"/>
        <rect x="634" y="380" width="32" height="160"/>
        <rect x="688" y="380" width="32" height="160"/>
        <rect x="742" y="380" width="32" height="160"/>
        <rect x="796" y="380" width="32" height="160"/>
        <rect x="850" y="380" width="32" height="160"/>
        <rect x="904" y="380" width="32" height="160"/>
        <rect x="958" y="380" width="32" height="160"/>
        <rect x="1012" y="380" width="32" height="160"/>
        <rect x="1066" y="380" width="32" height="160"/>
      </g>

      <!-- Column capitals — slightly wider flat cap at top of each column -->
      <g fill="#070B14">
        <rect x="36"  y="372" width="40" height="10"/>
        <rect x="90"  y="372" width="40" height="10"/>
        <rect x="144" y="372" width="40" height="10"/>
        <rect x="198" y="372" width="40" height="10"/>
        <rect x="252" y="372" width="40" height="10"/>
        <rect x="306" y="372" width="40" height="10"/>
        <rect x="360" y="372" width="40" height="10"/>
        <rect x="414" y="372" width="40" height="10"/>
        <rect x="468" y="372" width="40" height="10"/>
        <rect x="522" y="372" width="40" height="10"/>
        <rect x="576" y="372" width="40" height="10"/>
        <rect x="630" y="372" width="40" height="10"/>
        <rect x="684" y="372" width="40" height="10"/>
        <rect x="738" y="372" width="40" height="10"/>
        <rect x="792" y="372" width="40" height="10"/>
        <rect x="846" y="372" width="40" height="10"/>
        <rect x="900" y="372" width="40" height="10"/>
        <rect x="954" y="372" width="40" height="10"/>
        <rect x="1008" y="372" width="40" height="10"/>
        <rect x="1062" y="372" width="40" height="10"/>
      </g>

      <!-- Column base flare (slight widening at bottom) -->
      <g fill="#080C18">
        <rect x="36"  y="524" width="40" height="16"/>
        <rect x="90"  y="524" width="40" height="16"/>
        <rect x="144" y="524" width="40" height="16"/>
        <rect x="198" y="524" width="40" height="16"/>
        <rect x="252" y="524" width="40" height="16"/>
        <rect x="306" y="524" width="40" height="16"/>
        <rect x="360" y="524" width="40" height="16"/>
        <rect x="414" y="524" width="40" height="16"/>
        <rect x="468" y="524" width="40" height="16"/>
        <rect x="522" y="524" width="40" height="16"/>
        <rect x="576" y="524" width="40" height="16"/>
        <rect x="630" y="524" width="40" height="16"/>
        <rect x="684" y="524" width="40" height="16"/>
        <rect x="738" y="524" width="40" height="16"/>
        <rect x="792" y="524" width="40" height="16"/>
        <rect x="846" y="524" width="40" height="16"/>
        <rect x="900" y="524" width="40" height="16"/>
        <rect x="954" y="524" width="40" height="16"/>
        <rect x="1008" y="524" width="40" height="16"/>
        <rect x="1062" y="524" width="40" height="16"/>
      </g>

      <!-- ENTABLATURE (architrave + frieze) — solid band above colonnade -->
      <rect x="30"  y="300" width="1100" height="74" fill="url(#buildBody)"/>
      <!-- Entablature bottom shadow -->
      <rect x="30"  y="370" width="1100" height="5"  fill="#04060A"/>
      <!-- Gold cornice line on top of entablature -->
      <rect x="30"  y="300" width="1100" height="2.5" fill="url(#goldLine)"/>

      <!-- ATTIC STORY (main office block) -->
      <rect x="30"  y="158" width="1100" height="144" fill="url(#buildBody)"/>

      <!-- Attic windows — 3 rows × 13 windows -->
      <!-- slot width: 1100/13 ≈ 84.6px; win width: 30px; start x=50 -->
      <g fill="url(#winFill)">
        <!-- Row 1 y=168 -->
        <rect x="54"  y="168" width="30" height="36" rx="1"/>
        <rect x="139" y="168" width="30" height="36" rx="1"/>
        <rect x="224" y="168" width="30" height="36" rx="1"/>
        <rect x="309" y="168" width="30" height="36" rx="1"/>
        <rect x="394" y="168" width="30" height="36" rx="1"/>
        <rect x="479" y="168" width="30" height="36" rx="1"/>
        <rect x="564" y="168" width="30" height="36" rx="1"/>
        <rect x="649" y="168" width="30" height="36" rx="1"/>
        <rect x="734" y="168" width="30" height="36" rx="1"/>
        <rect x="819" y="168" width="30" height="36" rx="1"/>
        <rect x="904" y="168" width="30" height="36" rx="1"/>
        <rect x="989" y="168" width="30" height="36" rx="1"/>
        <rect x="1074" y="168" width="30" height="36" rx="1"/>
        <!-- Row 2 y=218 -->
        <rect x="54"  y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="139" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="224" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="309" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="394" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="479" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="564" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="649" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="734" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="819" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="904" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="989" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <rect x="1074" y="218" width="30" height="36" rx="1" opacity="0.7"/>
        <!-- Row 3 y=268 -->
        <rect x="54"  y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="139" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="224" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="309" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="394" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="479" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="564" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="649" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="734" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="819" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="904" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="989" y="268" width="30" height="28" rx="1" opacity="0.45"/>
        <rect x="1074" y="268" width="30" height="28" rx="1" opacity="0.45"/>
      </g>

      <!-- PARAPET / ROOF LINE -->
      <rect x="22"  y="132" width="1116" height="28" fill="#0A1020"/>
      <rect x="16"  y="118" width="1128" height="16" fill="#07090F"/>
      <!-- Gold parapet accent -->
      <rect x="16"  y="118" width="1128" height="2"  fill="url(#goldLine)" opacity="0.55"/>

      <!-- STEPS (3 wide treads) -->
      <rect x="22"  y="680" width="1116" height="26" fill="url(#stepsGrad)"/>
      <rect x="10"  y="706" width="1140" height="24" fill="#0C1520"/>
      <rect x="0"   y="730" width="1160" height="24" fill="#09111C"/>

      <!-- GROUND PLANE -->
      <rect x="0"   y="754" width="1160" height="106" fill="#06090E"/>

      <!-- Warm ground-level haze — poured light at building base -->
      <ellipse cx="580" cy="765" rx="540" ry="60"
               fill="#D08030" fill-opacity="0.22"/>

      <!-- Glowing horizon line at base of columns -->
      <rect x="30" y="539" width="1100" height="2"
            fill="url(#goldLine)" opacity="0.45"/>

    </svg>
  </div>

  <!-- OVERLAYS -->
  <div class="fade-left"></div>
  <div class="fade-top"></div>
  <div class="fade-bottom"></div>
  <div class="vignette"></div>

  <!-- LOGO -->
  <div class="logo-wrap">
    <!--
      ↓ SWAP THIS SVG BLOCK with your real logo.svg contents.
        Target: ~150px wide. Add width="150" to your <svg> root element.
    -->
    <svg width="158" height="38" viewBox="0 0 158 38" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="30"
            font-family="'Work Sans', sans-serif"
            font-weight="700"
            font-size="28"
            letter-spacing="1.5"
            fill="#FFFFFF">TOP<tspan fill="#E2A355">STEP</tspan></text>
    </svg>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">

    <p class="eyebrow">Topstep Presents</p>

    <h1 class="headline">FOMC<br>DAY</h1>

    <div class="divider"></div>

    <h2 class="subheadline">The Fed&nbsp;Decides</h2>

    <div class="meta">
      <div class="speaker-line">
        <span class="pip"></span>
        <span class="speaker">Jerome Powell &nbsp;·&nbsp; Federal Reserve Chair</span>
      </div>
      <p class="datetime">&nbsp;&nbsp;&nbsp;April 29, 2026 &nbsp;·&nbsp; 1:00&nbsp;PM&nbsp;CST</p>
    </div>

    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">Watch Live on Topstep</span>
    </div>

  </div>

</div>
</body>
</html>
